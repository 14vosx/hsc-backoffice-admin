@if (confirmation.activeRequest(); as request) {
  <div class="confirmation-dialog__backdrop" (click)="cancel()">
    <section
      class="confirmation-dialog"
      [class.confirmation-dialog--danger]="request.tone === 'danger'"
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirmation-dialog-title"
      aria-describedby="confirmation-dialog-message"
      cdkTrapFocus
      [cdkTrapFocusAutoCapture]="true"
      (click)="stopPropagation($event)"
    >
      <h2 id="confirmation-dialog-title" class="confirmation-dialog__title">
        {{ request.title }}
      </h2>

      <p id="confirmation-dialog-message" class="confirmation-dialog__message">
        {{ request.message }}
      </p>

      <div class="confirmation-dialog__actions">
        <button type="button" class="confirmation-dialog__button" (click)="cancel()">
          {{ request.cancelLabel ?? 'Cancelar' }}
        </button>
        <button
          type="button"
          class="confirmation-dialog__button confirmation-dialog__confirm"
          [class.confirmation-dialog__confirm--danger]="request.tone === 'danger'"
          (click)="confirm()"
        >
          {{ request.confirmLabel ?? 'Confirmar' }}
        </button>
      </div>
    </section>
  </div>
}
