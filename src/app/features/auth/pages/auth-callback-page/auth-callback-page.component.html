<main class="auth-callback-page">
  <app-ui-card class="auth-callback-page__card">
    <header class="auth-callback-page__header">
      <h1>HSC Backoffice Admin</h1>
      <p>Validação de acesso administrativo.</p>
    </header>

    <div class="auth-callback-page__content">
      @if (isResolving()) {
        <p>{{ message() }}</p>
      } @else {
        <p>{{ message() }}</p>

        @if (error(); as errorMessage) {
          <p class="auth-callback-page__error" role="alert">{{ errorMessage }}</p>
        }

        <button type="button" class="auth-callback-page__action" (click)="goToLogin()">
          Voltar para login
        </button>
      }
    </div>
  </app-ui-card>
</main>
