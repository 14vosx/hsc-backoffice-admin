<hsc-page-container
  title="Nova news"
  subtitle="Crie um novo draft administrativo para o domínio de news."
>
  <section class="news-create-page">
    <app-ui-card class="news-create-page__card">
      <div class="news-create-page__content">
        <hsc-news-form
          mode="create"
          [submitting]="submitting()"
          [errorMessage]="error()"
          (formSubmit)="submit($event)"
          (cancel)="cancel()"
        />
      </div>
    </app-ui-card>
  </section>
</hsc-page-container>
